# Publica o app React (studyloom-web) no GitHub Pages a cada push na main.
# Segurança: ações oficiais do GitHub fixadas por hash de commit e permissões mínimas por job.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nada é liberado por padrão; cada job pede só o que usa
permissions: {}

# Uma publicação por vez; uma nova cancela a que estiver na fila
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: studyloom-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: studyloom-web/package-lock.json

      - name: Instalar dependências (versões exatas do package-lock)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build para o subcaminho /fitloom/
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      # O Pages não redireciona rotas do app; o 404.html devolve o app e o React Router resolve a rota
      - name: Fallback de rotas
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: studyloom-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
